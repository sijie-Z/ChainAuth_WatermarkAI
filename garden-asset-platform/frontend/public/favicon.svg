<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67c23a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 园林图标 -->
  <rect x="10" y="60" width="80" height="30" fill="url(#grad)" rx="3"/>
  <!-- 房屋 -->
  <polygon points="30,40 50,20 70,40" fill="url(#grad)"/>
  <rect x="35" y="40" width="30" height="20" fill="#fff" stroke="url(#grad)" stroke-width="2"/>
  <!-- 水印标识 -->
  <circle cx="85" cy="15" r="12" fill="#67c23a" opacity="0.8"/>
  <text x="85" y="19" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">W</text>
  <!-- 区块链标识 -->
  <path d="M15,10 L25,20 L15,30 L5,20 Z" fill="#409eff" opacity="0.6"/>
  <path d="M15,10 L25,0 L35,10 L25,20 Z" fill="#409eff" opacity="0.4"/>
</svg>