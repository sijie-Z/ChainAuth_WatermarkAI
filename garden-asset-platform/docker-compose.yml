services:
  # 后端服务
  backend:
    build: ./backend
    container_name: garden-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-garden_asset}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - TRUST_PROXY_HEADERS=true
      - BLOCKCHAIN_ENABLED=${BLOCKCHAIN_ENABLED:-false}
      - AI_ENABLED=${AI_ENABLED:-false}
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/watermarks:/app/watermarks
      - ./backend/extracted:/app/extracted
      - ./backend/backups:/app/backups
      - ./backend/instance:/app/instance
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - garden-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 异步任务 worker（水印/链上存证）；与后端共享上传与数据库
  worker:
    build: ./backend
    container_name: garden-worker
    restart: unless-stopped
    command: ["python", "-m", "flask", "tasks", "run"]
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-garden_asset}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - BLOCKCHAIN_ENABLED=${BLOCKCHAIN_ENABLED:-false}
      - AI_ENABLED=${AI_ENABLED:-false}
      - TASK_WORKER_ENABLED=false
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/watermarks:/app/watermarks
      - ./backend/extracted:/app/extracted
      - ./backend/backups:/app/backups
      - ./backend/instance:/app/instance
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -m flask tasks status --check || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - garden-network

  # 前端服务
  frontend:
    build: ./frontend
    container_name: garden-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - garden-network

  # PostgreSQL数据库
  db:
    image: postgres:14-alpine
    container_name: garden-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-garden_asset}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - garden-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: garden-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - garden-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: garden-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - garden-network

networks:
  garden-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
