version: '3.8'

services:
  # 后端服务
  backend:
    build: ./backend
    container_name: garden-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/garden_asset
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    networks:
      - garden-network

  # 前端服务
  frontend:
    build: ./frontend
    container_name: garden-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - garden-network

  # PostgreSQL数据库
  db:
    image: postgres:14-alpine
    container_name: garden-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=garden_asset
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - garden-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: garden-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - garden-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: garden-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - garden-network

networks:
  garden-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: