name: Git Flow

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Git Flow branch pairs
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "PR 来源分支: ${HEAD_REF}"
          echo "PR 目标分支: ${BASE_REF}"

          case "$BASE_REF" in
            main)
              case "$HEAD_REF" in
                release/*|hotfix/*)
                  echo "✅ main ← ${HEAD_REF}"
                  ;;
                *)
                  echo "::error::main 只接受来自 release/* 或 hotfix/* 的 PR（当前: ${HEAD_REF}）"
                  exit 1
                  ;;
              esac
              ;;
            develop)
              case "$HEAD_REF" in
                feature/*|bugfix/*|release/*|hotfix/*|docs/*|chore/*|ci/*|refactor/*|test/*|perf/*|build/*|dependabot/*)
                  echo "✅ develop ← ${HEAD_REF}"
                  ;;
                *)
                  echo "::error::develop 不接受来自 ${HEAD_REF} 的 PR；请使用 feature/、bugfix/、docs/ 等前缀"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::未知的目标分支: ${BASE_REF}"
              exit 1
              ;;
          esac

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          wip: true

  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  conflict-check:
    name: conflict-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for merge conflict markers
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- ':!*.md' ':!package-lock.json'; then
            echo "::error::发现未解决的合并冲突标记"
            exit 1
          fi
          echo "✅ 未发现冲突标记"
