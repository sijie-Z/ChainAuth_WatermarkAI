name: E2E

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "garden-asset-platform/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [develop]
    paths:
      - "garden-asset-platform/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: garden-asset-platform/backend/requirements*.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: garden-asset-platform/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: garden-asset-platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Initialize database and seed data
        working-directory: garden-asset-platform/backend
        run: |
          python scripts/init_db.py
          python scripts/create_test_data.py

      - name: Start backend
        working-directory: garden-asset-platform/backend
        run: |
          nohup python -c "from app import create_app; app=create_app('development'); app.run(host='127.0.0.1', port=5000, debug=False, use_reloader=False)" > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/health

      - name: Install frontend dependencies
        working-directory: garden-asset-platform/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: garden-asset-platform/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: garden-asset-platform/frontend
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: garden-asset-platform/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: tail -100 /tmp/backend.log || true
