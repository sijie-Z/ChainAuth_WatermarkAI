name: Sync main into develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into a sync branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/sync-main-into-develop
          if git merge --no-edit origin/main; then
            echo "✅ 合并成功"
          else
            echo "::error::main → develop 出现合并冲突，请手动解决"
            git merge --abort
            exit 1
          fi

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-main-into-develop
          base: develop
          title: "chore: 同步 main 回 develop"
          commit-message: "chore: 同步 main 回 develop"
          delete-branch: true
          labels: |
            chore
          body: |
            自动回合并 `main` → `develop`（Git Flow 要求）。

            - 触发：`main` 有新提交（发布或热修合并）
            - 工作流：`.github/workflows/sync-main-into-develop.yml`
            - 合并方式：Merge commit

            如果本 PR 出现冲突，请手动解决后合并。
