name: Dependabot Auto Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # main 的 Ruleset 只允许 merge commit；develop 使用 squash
          if [ "${BASE_REF}" = "main" ]; then
            METHOD=--merge
          else
            METHOD=--squash
          fi
          gh pr merge --auto "$METHOD" "$PR_URL"

      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-label "major" || true
          gh pr comment "$PR_URL" --body "⚠️ 这是主版本更新，需要人工审查后再合并。"

      - name: Comment when auto-merge is armed
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "🤖 已开启自动合并：CI 与所需检查通过后会自动合并（main 用 merge commit，develop 用 squash）。"
