name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue / PR，确认没有重复建议。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 数字水印（嵌入 / 提取 / 鲁棒性）
        - 区块链存证
        - AI 溯源 / 检测
        - 资产管理与分发
        - 授权审批
        - 前端体验
        - 性能 / 部署
        - CI / 工程化
        - 其他

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前痛点，而不是直接给方案
      placeholder: 作为……我希望……以便……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 低（锦上添花）
        - 中（明显改进体验）
        - 高（阻塞关键流程）
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响范围 / 实现提示（可选）
      description: 可能涉及的模块、API、数据结构变更
